            }
          ]
        },
        {
          "type": "row",
          "title": "Qdrant (vector search)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 77,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Points in the collection",
          "description": "One point per ACTIVE car: id + 384-number vector + small payload. Sold cars are deleted.",
          "gridPos": {
            "x": 0,
            "y": 78,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 5
              }
            },
            "overrides": []
          },
