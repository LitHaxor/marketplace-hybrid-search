# Monitoring: Prometheus collects metrics, Grafana shows them.
#
# Prometheus finds pods to scrape by their annotations (see deployment.yaml):
#   prometheus.io/scrape: "true", prometheus.io/port, prometheus.io/path
# Every scraped pod gets an `app` label from its own `app` label, so one dashboard serves every JVM.
#
# Grafana:    http://localhost:3000   (no login in dev)
# Prometheus: http://localhost:9090
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: carmarketplace
---
# Prometheus may list pods in this namespace (to discover what to scrape), nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: carmarketplace
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: carmarketplace
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: carmarketplace
roleRef:
  kind: Role
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: carmarketplace
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s               # short interval: you see GC and spikes almost live
    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [carmarketplace]
        relabel_configs:
          # only pods that ask for it
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # metrics path from the annotation (/actuator/prometheus for Spring)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          # pod IP + port from the annotation
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(.+)
            replacement: $1:$2
            target_label: __address__
          # app and pod labels, for the dashboard's App dropdown
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # The API on your Mac (`gradle bootRun`, port 8081). Shows DOWN when it isn't running: that's fine.
      - job_name: local-dev
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["host.docker.internal:8081"]
            labels:
              app: api-local
          - targets: ["host.docker.internal:8082"]
            labels:
              app: ingest-worker-local
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: carmarketplace
spec:
  type: LoadBalancer
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: carmarketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.9.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {} # metrics are lost when the pod restarts: fine for dev
---
# Grafana data sources: metrics (Prometheus), traces (Tempo), profiles (Pyroscope).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: carmarketplace
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo:3200
      - name: Pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        url: http://pyroscope:4040
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: carmarketplace
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: dashboards
        folder: carmarketplace
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
# The "JVM and HTTP" dashboard. Pick the app (JVM) at the top.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: carmarketplace
data:
  jvm.json: |
    {
      "uid": "jvm",
      "title": "JVM and HTTP",
      "tags": [
        "jvm"
      ],
      "schemaVersion": 39,
      "editable": true,
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "refresh": "5s",
      "templating": {
        "list": [
          {
            "name": "app",
            "label": "App",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "qryType": 1,
              "query": "label_values(jvm_memory_used_bytes, app)",
              "refId": "app"
            },
            "definition": "label_values(jvm_memory_used_bytes, app)",
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Traffic: rate, errors, duration",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Requests per second",
          "description": "How much traffic each endpoint gets.",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 5,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (method, uri) (rate(http_server_requests_seconds_count{app=\"$app\", uri!~\"/actuator.*\"}[1m]))",
              "legendFormat": "{{method}} {{uri}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "description": "p99 = the slowest 1% of requests. GC pauses and CPU throttling show up here first.",
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 5,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_server_requests_seconds_bucket{app=\"$app\", uri!~\"/actuator.*\"}[1m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{app=\"$app\", uri!~\"/actuator.*\"}[1m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{app=\"$app\", uri!~\"/actuator.*\"}[1m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Errors per second (5xx)",
          "description": "",
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 5,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
