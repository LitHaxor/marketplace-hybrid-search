        {
          "type": "timeseries",
          "title": "Elasticsearch heap",
          "description": "Elasticsearch is a JVM too: 1 GB heap. The sawtooth is its own garbage collection.",
          "gridPos": {
            "x": 0,
            "y": 53,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
