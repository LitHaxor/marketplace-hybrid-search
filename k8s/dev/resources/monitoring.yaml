          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Heap used by area",
          "description": "Eden = new objects (fills fast, emptied by young GC). Old Gen = survivors. A rising Old Gen floor = possible leak.",
          "gridPos": {
