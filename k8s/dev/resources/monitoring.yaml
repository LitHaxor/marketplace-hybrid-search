            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (endpoint) (rate(grpc_responses_total[1m]))",
              "legendFormat": "{{endpoint}}"
