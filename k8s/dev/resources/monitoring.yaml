            "y": 53,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 5
              }
            },
            "overrides": []
          },
