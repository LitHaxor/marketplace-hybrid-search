          ]
        },
        {
          "type": "timeseries",
          "title": "Call latency p95",
          "description": "How long Qdrant takes per call, as Qdrant measures it (network to the caller not included).",
          "gridPos": {
            "x": 16,
            "y": 78,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
